<!DOCTYPE html>

<html lang="pt-BR">

<head>

  <meta charset="UTF-8">

  <title>Área do Aluno</title>

</head>

<body>

  <h2>Login do Aluno</h2>

  <form id="login-aluno">

    <input type="email" id="email" placeholder="Digite seu e-mail" required />

    <input type="password" id="senha" placeholder="Digite sua senha" required />

    <button type="submit">Acessar</button>

  </form>



  <p id="mensagem"></p>



  <script>

    const form = document.getElementById('login-aluno');

    const msg = document.getElementById('mensagem');



    form.addEventListener('submit', (e) => {

      e.preventDefault();



      const email = document.getElementById('email').value;

      const senha = document.getElementById('senha').value;



      if (email === "aluno@curso.com" && senha === "curso2024") {

        document.cookie = "curso_token=curso123";

        localStorage.setItem("aluno_email", email);

        msg.textContent = "Acesso concedido!";

      } else {

        msg.textContent = "Credenciais incorretas.";

      }

    });

  </script>

</body>

</html>
